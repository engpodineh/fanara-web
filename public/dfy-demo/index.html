(function(){

  window.claude = { use: async function(name){
    if (name === 'downloads') return { save: async function(o){

      if (!st || !st.enabled) return null;
      var call = async function(prompt, opts){
        opts = opts || {};
        var r = await fetch('/dfy-demo/ai', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ prompt: String(prompt).slice(0, 24000) }) });

<style>
  :root{
    --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF2F6; --surface-3:#E3E9EF;
    --border:#D9E1E9; --text:#152233; --text-muted:#5C6C7C; --text-faint:#8C9AA8;
    --primary:#1B4F91; --primary-strong:#123A6B; --primary-soft:#E7F0FC;
    --accent:#C1762A; --accent-soft:#FBEEE0;
    --success:#28855A; --success-soft:#E5F5EC;
    --warning:#B8791C; --warning-soft:#FCF0DC;
    --danger:#BE3F2C; --danger-soft:#FBEAE6;
    --locked:#95A3B1;
    --shadow:0 1px 2px rgba(15,32,54,.06), 0 6px 16px rgba(15,32,54,.06);
    --radius:14px; --radius-sm:9px;
    --font-display:'Vazirmatn',Tahoma,sans-serif;
    --font-body:'Vazirmatn',Tahoma,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1420; --surface:#141E2C; --surface-2:#1A2534; --surface-3:#22303F;
      --border:#2A3B4D; --text:#E7ECF2; --text-muted:#9DAFC1; --text-faint:#6E8098;
      --primary:#6FA3E0; --primary-strong:#9AC2ED; --primary-soft:#132A44;
      --accent:#E6A257; --accent-soft:#3A2A17;
      --success:#5CBE84; --success-soft:#173226;
      --warning:#E0B24A; --warning-soft:#3A2E13;
      --danger:#E28A7A; --danger-soft:#3A1E1A;
      --locked:#6E8098;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1420; --surface:#141E2C; --surface-2:#1A2534; --surface-3:#22303F;
    --border:#2A3B4D; --text:#E7ECF2; --text-muted:#9DAFC1; --text-faint:#6E8098;
    --primary:#6FA3E0; --primary-strong:#9AC2ED; --primary-soft:#132A44;
    --accent:#E6A257; --accent-soft:#3A2A17;
    --success:#5CBE84; --success-soft:#173226;
    --warning:#E0B24A; --warning-soft:#3A2E13;
    --danger:#E28A7A; --danger-soft:#3A1E1A;
    --locked:#6E8098;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.4);
    color-scheme: dark;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
  .app{direction:rtl;text-align:right;min-height:100dvh}
  h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance}
  p{margin:0}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  ::selection{background:var(--primary-soft)}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  a{color:var(--primary)}
  .icon{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .icon-lg{width:26px;height:26px}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- shell ---------- */
  .shell{display:flex;min-height:100dvh}
  .sidebar{
    flex:0 0 264px;width:264px;background:var(--surface);border-inline-start:1px solid var(--border);
    display:flex;flex-direction:column;padding-block:calc(20px + env(safe-area-inset-top,0px)) 16px;
    position:sticky;top:0;height:100dvh;overflow-y:auto;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:10px;padding-inline:20px;margin-bottom:22px}
  .brand-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(155deg,var(--primary),var(--primary-strong));display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
  .brand-text h1{font-size:16px;font-weight:800;line-height:1.25}
  .brand-text span{font-size:11.5px;color:var(--text-faint)}
  .active-project-box{margin:0 12px 14px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm)}
  .nav-group{padding-inline:12px;margin-bottom:4px}
  .nav-label{font-size:11px;color:var(--text-faint);padding:10px 10px 6px;letter-spacing:.04em}
  .nav-item{
    display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:var(--radius-sm);
    border:none;background:transparent;color:var(--text-muted);font-size:13.5px;font-weight:500;text-align:start;
    transition:background .12s,color .12s;
  }
  .nav-item:hover{background:var(--surface-2);color:var(--text)}
  .nav-item.active{background:var(--primary-soft);color:var(--primary-strong);font-weight:700}
  .nav-item .icon{color:inherit}
  .sidebar-foot{margin-top:auto;padding:14px 20px 4px;border-top:1px solid var(--border)}

  .topbar{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb, var(--bg) 88%, transparent);

  }

  .topbar-sub{font-size:12px;color:var(--text-faint);margin-top:2px}
  .menu-btn{display:none;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:8px;color:var(--text)}

  .view{padding:22px;max-width:1180px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:20px}

  /* ---------- generic building blocks ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-pad{padding:18px 20px}
  .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

  .faint{color:var(--text-faint)}

  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--radius-sm);padding:9px 15px;font-size:13px;font-weight:600;border:1px solid transparent;transition:transform .08s,filter .12s,background .12s;white-space:nowrap}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-accent{background:var(--accent);color:#fff}
  .btn-accent:hover{filter:brightness(1.08)}
  .btn-ghost{background:var(--surface-2);color:var(--text);border-color:var(--border)}
  .btn-ghost:hover{background:var(--surface-3)}
  .btn-outline{background:transparent;color:var(--primary);border-color:var(--primary)}
  .btn-sm{padding:6px 11px;font-size:12px}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;line-height:1.7}

  .badge-accent{background:var(--accent-soft);color:var(--accent)}
  .badge-success{background:var(--success-soft);color:var(--success)}
  .badge-warning{background:var(--warning-soft);color:var(--warning)}
  .badge-danger{background:var(--danger-soft);color:var(--danger)}
  .badge-locked{background:var(--surface-3);color:var(--locked)}

  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

  .kpi-top{display:flex;align-items:center;justify-content:space-between}
  .kpi-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
  .kpi-val{font-family:var(--font-mono);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
  .kpi-label{font-size:12px;color:var(--text-muted)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:start;font-size:11.5px;color:var(--text-faint);font-weight:700;letter-spacing:.02em;padding:9px 10px;border-bottom:1px solid var(--border)}
  tbody td{padding:10px 10px;border-bottom:1px solid var(--border)}
  tbody tr:last-child td{border-bottom:none}

  .table-wrap{overflow-x:auto}
  .price-input{width:118px;padding:6px 8px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);font-family:var(--font-mono);font-size:12.5px;text-align:start}
  .price-input:focus{outline:2px solid var(--primary);outline-offset:1px}

  .empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:46px 24px;color:var(--text-muted)}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .stack{display:flex;flex-direction:column;gap:14px}

  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12.5px;font-weight:600;color:var(--text-muted)}
  .field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{
    padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-size:13.5px;width:100%;
  }
  .field textarea{resize:vertical;min-height:78px;font-family:inherit}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--primary);outline-offset:1px}

  .toast-wrap{position:fixed;bottom:18px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none}
  .toast{background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}

  .ai-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px}
  .ai-note{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--primary-soft);color:var(--primary-strong);border-radius:9px;padding:9px 12px;font-size:12px}

  .spinner{width:15px;height:15px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--primary);animation:spin .7s linear infinite;flex:none}

  .ai-output{white-space:pre-wrap;line-height:1.85;font-size:13.5px}
  .cursor-blink{display:inline-block;width:2px;height:1em;background:var(--primary);vertical-align:text-bottom;animation:blink 1s step-start infinite}

  .wo-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;display:flex;flex-direction:column;gap:8px}

  .confirm-box{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:9px;padding:8px 10px;flex-wrap:wrap}

  .wo-checklist{margin:0;padding:0;list-style:none;font-size:12.5px;color:var(--text-muted);display:flex;flex-direction:column;gap:5px;background:var(--surface-2);border-radius:9px;padding:10px 12px}

  .wo-section-label{font-size:11px;font-weight:700;color:var(--text-faint);margin-bottom:-2px}

  .ck-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 15px;display:flex;flex-direction:column;gap:6px}
  .ck-card summary{cursor:pointer;font-size:13.5px;font-weight:700;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}

  .upload-zone{
    border:2px dashed var(--border);border-radius:var(--radius);padding:38px 20px;display:flex;flex-direction:column;

  }

  .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));width:0%;transition:width .18s}
  .upload-log{font-size:12px;color:var(--text-faint);font-family:var(--font-mono)}

  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
  .photo-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--border)}

  .report-entry{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .report-entry-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}

  .kb-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

  .kb-code{font-family:var(--font-mono);font-size:11px;color:var(--primary);font-weight:700}
  .kb-title{font-size:13.5px;font-weight:700}
  .kb-org{font-size:11.5px;color:var(--text-faint)}
  .kb-desc{font-size:12.5px;color:var(--text-muted);line-height:1.6}
  .search-box{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:8px 14px;background:var(--surface)}
  .search-box input{border:none;outline:none;background:none;width:100%;font-size:13px;color:var(--text)}
  .search-box .icon{color:var(--text-faint)}

  .locked-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .locked-card{border:1px dashed var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2);color:var(--locked);position:relative;overflow:hidden}

  .locked-card h4{font-size:13.5px;color:var(--text)}
  .locked-card p{font-size:12px;color:var(--text-faint);line-height:1.6}

  .banner{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:var(--radius);background:linear-gradient(120deg,var(--primary-soft),var(--surface));border:1px solid var(--border)}

  .pill-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}

  /* ---------- landing / investor pitch page ---------- */
  .landing{display:none;min-height:100dvh;background:var(--bg);overflow-y:auto}
  .landing.show{display:block}
  .landing-topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 5vw;background:var(--surface);border-bottom:1px solid var(--border)}
  .landing-topbar-brand{display:flex;align-items:center;gap:10px}

function buildInventory(items){
  const inv = {};
  items.forEach(it => { inv[it.id] = { name:it.name, unit:it.unit, initial: Math.round(it.qty*1.15*100)/100, consumed:0 }; });
  return inv;
}

// تا کد موجود بدون تغییر کار کند و در عین حال داده هر پروژه کاملا مجزا بماند.
const PROJECT_STATE_KEYS = ['boq','inventory','archive','uploads','workOrders','statements','purchaseRequests','dailyReports','kbQuery','kbAnswer','kbAsking','activeCountry','users','boqApproval'];
const PROJECT_META_KEYS = ['name','client','location','area','units','id','drawingFile'];

const _stateOwn = {
  view: 'landing',
  woGenerating: false,
  poGenerating: false,
  aiState: 'checking', // checking | ready | unavailable
};
const state = new Proxy(_stateOwn, {
  get(target, prop){ return PROJECT_STATE_KEYS.includes(prop) ? activeProject()[prop] : Reflect.get(target, prop); },
  set(target, prop, value){ if(PROJECT_STATE_KEYS.includes(prop)){ activeProject()[prop] = value; return true; } return Reflect.set(target, prop, value); },
});
const PROJECT = new Proxy({}, {
  get(target, prop){ return activeProject()[prop]; },
  set(target, prop, value){ activeProject()[prop] = value; return true; },
});

let sampleAPI = null;
let downloadsAPI = null;

async function connectAI(){
  state.aiState = 'checking';
  try{ render(); }catch(e){}
  try { if(state.assistant) renderAssistantPanel(); }catch(e){}
  try { sampleAPI = (window.claude && window.claude.use) ? await window.claude.use('sample') : null; }
  catch(e){ sampleAPI = null; }
  state.aiState = sampleAPI ? 'ready' : 'unavailable';
  try { downloadsAPI = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; }
  catch(e){ downloadsAPI = null; }
  try{ render(); }catch(e){}
  try { if(state.assistant) renderAssistantPanel(); }catch(e){}
}

/* ============================== UTILS ============================== */
function money(n){ return Math.round(n).toLocaleString('en-US'); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl2br(s){ return escapeHtml(s).replace(/\n/g,'<br>'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ try{ return new Date(iso+'T00:00:00').toLocaleDateString('fa-IR',{year:'numeric',month:'long',day:'numeric'});}catch(e){return iso;} }

function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 250); }, 3200);
}

function boqTotal(list){ return (list||state.boq).reduce((s,i)=> s + i.qty*i.unitPrice, 0); }
function statementsTotal(){ return state.statements.reduce((s,x)=> s+x.amount, 0); }

async function downloadText(filename, text){
  if(!downloadsAPI){ toast('دانلود فایل در این نما در دسترس نیست'); return; }
  try{
    const res = await downloadsAPI.save({ filename, data: text });
    if(res && res.status==='saved') toast('فایل ذخیره شد');
  }catch(e){
    if(e && e.code==='declined') return;
    toast('دانلود انجام نشد');
  }
}

function psHead(docTitle, docSub){
  return `<div class="ps-head">
    <div class="ps-brand">دفتر فنی یار<span>نسخه دموی سرمایه‌گذار — سامانه دیجیتال مدیریت فنی و اجرایی</span></div>
    <div class="ps-doc-title">${escapeHtml(docTitle)}<span>${escapeHtml(docSub||'')}</span></div>
  </div>`;
}
function psMeta(fields){
  return `<div class="ps-meta">${fields.map(f=>`<div><b>${escapeHtml(f[0])}</b>${escapeHtml(f[1])}</div>`).join('')}</div>`;
}
function psSign(labels){
  return `<div class="ps-sign">${labels.map(l=>`<div>${escapeHtml(l)}</div>`).join('')}</div>`;
}
function psFoot(){
  return `<div class="ps-foot">این سند به‌صورت خودکار توسط سامانه «دفتر فنی یار» تولید شده است — تاریخ تولید: ${escapeHtml(fmtDate(todayISO()))}</div>`;
}

function pdfLibsReady(){ return !!(window.html2canvas && window.jspdf && window.jspdf.jsPDF); }

let _printQueue = Promise.resolve();
function printSection(bodyHtml, opts){
  // opts: { title, sub, filename, folder, relatedLabel, silent }
  // فراخوانی‌ها صف می‌شوند تا دو ساخت PDF هم‌زمان با هم تداخل نکنند (مثلا تایید نهایی که هم دستور کار و هم صورت‌وضعیت را آرشیو می‌کند).
  _printQueue = _printQueue.then(()=> _runPrint(bodyHtml, opts)).catch(()=>{});
  return _printQueue;
}
async function _runPrint(bodyHtml, opts){
  if(!pdfLibsReady()){ if(!opts.silent) toast('در حال بارگذاری موتور PDF... چند لحظه دیگر دوباره تلاش کنید'); return; }
  const overlay = document.getElementById('pdfOverlay');
  const sheet = document.getElementById('printSheet');
  if(!opts.silent) overlay.classList.add('show');
  sheet.innerHTML = psHead(opts.title, opts.sub) + bodyHtml + psFoot();
  try{
    await new Promise(r=> setTimeout(r, 60)); // let images/layout settle
    const canvas = await window.html2canvas(sheet, { scale:2, backgroundColor:'#ffffff', useCORS:true });
    const { jsPDF } = window.jspdf;
    const pageW = 210, pageH = 297; // A4 mm
    const imgW = pageW;
    const imgH = canvas.height * imgW / canvas.width;
    const pdf = new jsPDF({ unit:'mm', format:'a4' });
    let heightLeft = imgH, position = 0;
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
    heightLeft -= pageH;
    while(heightLeft > 0){
      position = heightLeft - imgH;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
      heightLeft -= pageH;
    }
    const blob = pdf.output('blob');
    const filename = (opts.filename||'سند') + '.pdf';
    addToArchive(opts.folder, { name:filename, blob, time:Date.now(), relatedLabel:opts.relatedLabel||'' });
    if(opts.silent){
      toast(`نسخه PDF «${opts.title}» به‌طور خودکار در بایگانی ذخیره شد`);
    } else {
      toast('PDF ساخته شد و به بایگانی اضافه شد');
      if(downloadsAPI){
        try{ await downloadsAPI.save({ filename, data: blob }); }
        catch(e){ if(!e || e.code!=='declined') toast('فایل در بایگانی موجود است؛ دانلود مستقیم انجام نشد'); }
      }
    }
  }catch(e){
    if(!opts.silent) toast('ساخت PDF ناموفق بود. دوباره تلاش کنید');
  }
  if(!opts.silent) overlay.classList.remove('show');
}

function addToArchive(folder, file){
  if(!state.archive[folder]) state.archive[folder] = [];
  state.archive[folder].unshift(file);
  if(state.view==='archive') render();
}

async function downloadArchiveFile(folder, idx){
  const file = (state.archive[folder]||[])[idx];
  if(!file || !downloadsAPI) { toast('دانلود در این نما در دسترس نیست'); return; }
  try{ await downloadsAPI.save({ filename:file.name, data:file.blob }); }
  catch(e){ if(!e || e.code!=='declined') toast('دانلود انجام نشد'); }
}

/* ============================== RENDER DISPATCH ============================== */
function render(){
  const landingEl = document.getElementById('landingPage');
  const shellEl = document.getElementById('appShell');
  const fab = document.getElementById('assistantFab');
  if(state.view==='landing'){
    shellEl.style.display = 'none';
    if(fab) fab.style.display = 'none';
    landingEl.classList.add('show');
    landingEl.innerHTML = renderLandingPage();
    bindLandingEvents();
    window.scrollTo(0,0);
    return;
  }
  landingEl.classList.remove('show');
  shellEl.style.display = '';
  if(fab) fab.style.display = '';
  renderSidebar();
  document.getElementById('topTitle').textContent = VIEW_META[state.view].title;
  document.getElementById('topSub').textContent = VIEW_META[state.view].sub;
  document.getElementById('topTotalVal').textContent = money(boqTotal()) + ' تومان';
  const root = document.getElementById('viewRoot');
  const renderers = { dashboard:renderDashboard, roi:renderROI, upload:renderUpload, takeoff:renderTakeoff, workorders:renderWorkOrders,
    statements:renderStatements, purchase:renderPurchase, daily:renderDaily, knowledge:renderKnowledge, locked:renderLocked,
    inventory:renderInventory, archive:renderArchive, projects:renderProjects, users:renderUsers, ceo:renderCEO };
  root.innerHTML = renderers[state.view]();
  bindViewEvents();
}

/* ============================== ROI / IMPACT CHARTS ============================== */
function wrapChartLabel(text, maxCharsPerLine, maxLines){
  const words = String(text).split(' ');
  const lines = [];
  let cur = '';
  words.forEach(word=>{
    const candidate = cur ? cur+' '+word : word;
    if(candidate.length > maxCharsPerLine && cur){ lines.push(cur); cur = word; }
    else cur = candidate;
  });
  if(cur) lines.push(cur);
  if(lines.length > maxLines){
    const kept = lines.slice(0, maxLines);
    kept[maxLines-1] = kept[maxLines-1].replace(/\s*\S*$/, '') + '…';
    return kept;
  }
  return lines;
}
function svgBarChart({data, height=210, valueSuffix='', colorVar='--primary', formatValue}){
  const w = Math.max(320, data.length*94);
  const maxLabelLines = 2;
  const padL=8, padR=8, padT=26, padB=22+maxLabelLines*13;
  const chartW = w-padL-padR, chartH = height-padT-padB;
  const maxVal = Math.max(...data.map(d=>d.value), 1)*1.18;
  const gap = chartW/data.length;
  const barW = Math.min(58, gap*0.5);
  const maxCharsPerLine = Math.max(8, Math.floor(gap/6.4));
  const gridLines = [0,0.5,1].map(f=>{
    const y = padT + chartH - f*chartH;
    return `<line class="chart-gridline" x1="${padL}" x2="${w-padR}" y1="${y}" y2="${y}"/>`;
  }).join('');
  const bars = data.map((d,i)=>{
    const x = padL + gap*i + (gap-barW)/2;
    const barH = Math.max((d.value/maxVal)*chartH, 2);
    const y = padT+chartH-barH;
    const fmt = formatValue ? formatValue(d.value) : d.value.toLocaleString('en-US');
    const cx = (x+barW/2).toFixed(1);
    const labelLines = wrapChartLabel(d.label, maxCharsPerLine, maxLabelLines);
    const tspans = labelLines.map((ln,li)=> `<tspan x="${cx}" dy="${li===0?0:12}">${escapeHtml(ln)}</tspan>`).join('');
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="6" fill="var(${d.colorVar||colorVar})"><title>${escapeHtml(d.label)}: ${fmt}${valueSuffix}</title></rect>
      <text x="${cx}" y="${(y-8).toFixed(1)}" text-anchor="middle" class="chart-value-label">${fmt}${valueSuffix}</text>
      <text x="${cx}" y="${height-padB+16}" text-anchor="middle" class="chart-bar-label">${tspans}</text>`;
  }).join('');
  return `<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 ${w} ${height}" width="100%" height="${height}" preserveAspectRatio="xMidYMid meet">
    ${gridLines}
    <line class="chart-axis-line" x1="${padL}" x2="${w-padR}" y1="${padT+chartH}" y2="${padT+chartH}"/>
    ${bars}
  </svg></div>`;
}
function svgLineChart({data, height=200, colorVar='--success', valueSuffix='', formatValue}){
  const w = Math.max(360, data.length*84);
  const maxLabelLines = 2;
  const padL=10, padR=14, padT=26, padB=18+maxLabelLines*13;
  const chartW=w-padL-padR, chartH=height-padT-padB;
  const values = data.map(d=>d.value);
  const maxVal = Math.max(...values)*1.2 || 1;
  const minVal = Math.min(0, Math.min(...values));
  const range = (maxVal-minVal)||1;
  const stepX = data.length>1 ? chartW/(data.length-1) : 0;
  const maxCharsPerLine = Math.max(8, Math.floor((stepX||chartW)/6.4));
  const pts = data.map((d,i)=>({ x:padL+stepX*i, y:padT+chartH-((d.value-minVal)/range)*chartH, d }));
  const gridLines = [0,0.5,1].map(f=>{
    const y = padT + chartH - f*chartH;
    return `<line class="chart-gridline" x1="${padL}" x2="${w-padR}" y1="${y}" y2="${y}"/>`;
  }).join('');
  const path = pts.map((p,i)=> (i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const areaPath = path + ` L${pts[pts.length-1].x.toFixed(1)} ${(padT+chartH).toFixed(1)} L${pts[0].x.toFixed(1)} ${(padT+chartH).toFixed(1)} Z`;
  const dots = pts.map(p=>{
    const fmt = formatValue?formatValue(p.d.value):p.d.value.toLocaleString('en-US');
    const cx = p.x.toFixed(1);
    const labelLines = wrapChartLabel(p.d.label, maxCharsPerLine, maxLabelLines);
    const tspans = labelLines.map((ln,li)=> `<tspan x="${cx}" dy="${li===0?0:12}">${escapeHtml(ln)}</tspan>`).join('');
    return `<circle cx="${cx}" cy="${p.y.toFixed(1)}" r="4.5" fill="var(${colorVar})" stroke="var(--surface)" stroke-width="2"><title>${escapeHtml(p.d.label)}: ${fmt}${valueSuffix}</title></circle>
    <text x="${cx}" y="${(p.y-11).toFixed(1)}" text-anchor="middle" class="chart-value-label">${fmt}${valueSuffix}</text>
    <text x="${cx}" y="${height-padB+16}" text-anchor="middle" class="chart-bar-label">${tspans}</text>`;
  }).join('');
  return `<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 ${w} ${height}" width="100%" height="${height}" preserveAspectRatio="xMidYMid meet">
    ${gridLines}
    <path d="${areaPath}" fill="var(${colorVar})" opacity="0.12" stroke="none"/>
    <path d="${path}" fill="none" stroke="var(${colorVar})" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg></div>`;
}
function chartLegend(items){
  return `<div class="chart-legend">${items.map(it=>`<span class="chart-legend-item"><span class="chart-legend-swatch" style="background:var(${it.colorVar})"></span>${escapeHtml(it.label)}</span>`).join('')}</div>`;
}

function fileKind(name){
  const ext = (name.split('.').pop()||'').toLowerCase();
  if(['rvt','ifc'].includes(ext)) return 'model';
  if(['xlsx','xls','csv'].includes(ext)) return 'excel';
  if(ext==='pdf') return 'pdf';
  if(['doc','docx'].includes(ext)) return 'word';
  return 'other';
}
const FILE_KIND_LABEL = { model:'مدل Revit/IFC', excel:'خروجی متره اکسل', pdf:'خروجی متره PDF', word:'خروجی متره Word', other:'فایل' };

function renderUpload(){
  return `
  <div class="card card-pad stack">
    <div class="section-title">
      <h3>بارگذاری نقشه یا خروجی متره برآورد</h3>
      <p>اگر پروژه نقشه/مدل رویت دارد، فایل rvt یا ifc را بارگذاری کنید. اگر نقشه رویت در اختیار نیست ولی خروجی متره‌برآورد آن به‌صورت اکسل، PDF یا Word تهیه شده، همان فایل را بارگذاری کنید — سامانه جدول متره را از آن استخراج می‌کند. در این نمونه، خواندن فایل با داده‌های نمونه شبیه‌سازی می‌شود و اقلام جدید به متره اضافه می‌گردد.</p>

      ${svgIcon('upload','icon-lg')}
      <div><strong>فایل را اینجا رها کنید</strong><div class="faint" style="font-size:12px;margin-top:4px">مدل: rvt، ifc &nbsp;|&nbsp; خروجی متره برآورد: xlsx، xls، csv، pdf، doc، docx</div></div>
      <input type="file" id="fileInput" class="visually-hidden" accept=".rvt,.ifc,.xlsx,.xls,.csv,.pdf,.doc,.docx">
      <button class="btn btn-primary" id="pickFileBtn">${svgIcon('plus')}<span>انتخاب فایل</span></button>
      <div id="uploadProgressWrap" style="display:none;width:100%;align-items:center;flex-direction:column;gap:8px">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

      </div>

    ${state.uploads.length? state.uploads.slice().reverse().map(u=>`
      <div class="file-history-item">
        ${svgIcon('check')}<span style="color:var(--success);font-weight:700">پردازش شد</span>
        <span style="flex:1">${escapeHtml(u.name)}</span>
        <span class="badge badge-primary">${FILE_KIND_LABEL[u.kind]||'فایل'}</span>
        <span class="faint">${u.newItems} قلم جدید</span>

function bindUploadEvents(){
  const zone = document.getElementById('dropZone');
  const input = document.getElementById('fileInput');
  const pickBtn = document.getElementById('pickFileBtn');
  if(!zone) return;
  pickBtn.addEventListener('click', ()=> input.click());
  zone.addEventListener('click', (e)=>{ if(e.target===zone) input.click(); });
  input.addEventListener('change', ()=>{ if(input.files[0]) simulateUpload(input.files[0]); });
  ['dragenter','dragover'].forEach(ev=> zone.addEventListener(ev, e=>{ e.preventDefault(); zone.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev=> zone.addEventListener(ev, e=>{ e.preventDefault(); zone.classList.remove('drag'); }));
  zone.addEventListener('drop', e=>{ const f = e.dataTransfer.files[0]; if(f) simulateUpload(f); });
}

function simulateUpload(file){
  const wrap = document.getElementById('uploadProgressWrap');
  const fill = document.getElementById('progressFill');
  const log = document.getElementById('uploadLog');
  wrap.style.display='flex';
  const kind = fileKind(file.name);
  const stepsByKind = {
    model: ['در حال خواندن هندسه مدل...', 'استخراج لایه‌های تاسیسات مکانیکی...', 'استخراج لایه‌های تاسیسات برقی...', 'تطبیق با متره پایه پروژه...', 'نهایی‌سازی...'],
    excel: ['در حال باز کردن فایل اکسل...', 'شناسایی جدول متره برآورد...', 'تطبیق ردیف‌ها با فهرست‌بهای مرجع...', 'استخراج اقلام جدید...', 'نهایی‌سازی...'],
    pdf: ['در حال خواندن صفحات PDF...', 'استخراج جدول متره برآورد از متن...', 'تطبیق ردیف‌ها با فهرست‌بهای مرجع...', 'استخراج اقلام جدید...', 'نهایی‌سازی...'],
    word: ['در حال خواندن فایل Word...', 'استخراج جدول متره برآورد از سند...', 'تطبیق ردیف‌ها با فهرست‌بهای مرجع...', 'استخراج اقلام جدید...', 'نهایی‌سازی...'],
    other: ['در حال خواندن فایل...', 'استخراج داده‌ها...', 'تطبیق با متره پایه پروژه...', 'نهایی‌سازی...'],
  };
  const steps = stepsByKind[kind] || stepsByKind.other;
  let pct = 0, si = 0;
  const timer = setInterval(()=>{
    pct = Math.min(100, pct + 14 + Math.random()*10);
    fill.style.width = pct+'%';
    if(pct/100*steps.length > si && si < steps.length-1){ si++; log.textContent = steps[si]; }
    if(pct>=100){
      clearInterval(timer);
      const alreadyDiscovered = state.boq.some(i=>i.id==='b9');
      const added = alreadyDiscovered ? [] : BOQ_DISCOVERED;
      state.boq = state.boq.concat(added.map(x=>({...x})));
      Object.assign(state.inventory, buildInventory(added));
      state.uploads.push({ name:file.name, kind, time:Date.now(), newItems: added.length });
      toast(`فایل «${file.name}» (${FILE_KIND_LABEL[kind]}) با موفقیت پردازش شد`);
      setTimeout(()=>render(), 500);
    }
  }, 260);
}

function pickChecklists(group){
  // چک‌لیست عمومی همیشه لحاظ می‌شود، به‌علاوه چک‌لیست‌های مرتبط با رشته قلم متره‌ای.
  const byGroup = CHECKLIST_LIBRARY.filter(c => c.group===group);
  const structural = CHECKLIST_LIBRARY.filter(c => c.group==='سازه و زیرسازی');
  const general = CHECKLIST_LIBRARY.filter(c => c.group==='عمومی');
  // چک‌لیست‌های سازه به‌عنوان زمینه فنی تکمیلی (اجرای صحیح مسیرها/تاسیسات معمولا پس از مرحله سازه است) با اولویت پایین‌تر افزوده می‌شوند.
  const combined = [...general, ...byGroup, ...structural];
  const seen = new Set();
  return combined.filter(c => (seen.has(c.id) ? false : (seen.add(c.id), true)));
}

function checklistDigest(list){
  return list.map(c => `# ${c.title} (منبع: ${c.source})\n` + c.items.map(i=>`- ${i}`).join('\n')).join('\n\n');
}

async function generateWorkOrder(){
  if(!sampleAPI || state.woGenerating) return;
  if(!state.boq.length){ toast('ابتدا اقلام متره پروژه را بارگذاری یا وارد کنید'); return; }
  if(state.activeCountry==='iran' && state.boqApproval.status!=='approved'){ toast('ابتدا ناظر باید احجام و قیمت‌های متره را تایید کند'); return; }
  state.woGenerating = true;
  const used = state.workOrders.map(w=>w.itemId);
  let item = state.boq.find(i=> !used.includes(i.id)) || state.boq[state.workOrders.length % state.boq.length];
  const holder = { id:'wo-'+Date.now(), itemId:item.id, itemName:item.name, status:'pending', time:Date.now(), streaming:true, raw:'' };
  state.workOrders.unshift(holder);
  render();
  const relevantChecklists = pickChecklists(item.group);
  const digest = checklistDigest(relevantChecklists);
  const activeMeta = COUNTRIES.find(c=>c.id===state.activeCountry);
  const isIran = state.activeCountry === 'iran';
  const countryKnowledge = KNOWLEDGE_BY_COUNTRY[state.activeCountry] || KNOWLEDGE;
  const standardsList = countryKnowledge.filter(k => relevantChecklists.some(c => c.source.includes(k.code)) || k.org.includes('بین‌الملل') ).map(k=>k.code);
  const countryRefs = countryKnowledge.map(k=> `${k.code} — ${k.title} (${k.org})`).join('\n');
  const countryNote = isIran ? '' : `\nکشور فعالیت انتخاب‌شده کاربر: ${activeMeta.label} (روش قرارداد/متره رایج: ${activeMeta.contractLabel}). ارجاعات استاندارد خروجی (standardsRef) را از بانک اطلاعاتی ${activeMeta.label} زیر انتخاب کن، نه از مباحث مقررات ملی ساختمان ایران:\n${countryRefs}\n`;
  const prompt = `تو دستیار هوش مصنوعی سامانه «دفتر فنی یار» هستی که برای مهندسان مشاور و پیمانکاران دستور کار اجرایی تهیه می‌کند.
تمام محتوای زیر از کتابخانه فنی داخلی سامانه (فایل‌های واقعی بارگذاری‌شده توسط کارفرما + استانداردهای ملی و بین‌المللی کشور فعالیت انتخاب‌شده) استخراج شده و باید صرفاً همین منبع مبنای چک‌لیست تو باشد، نه دانش عمومی خودت.
${countryNote}
اطلاعات پروژه نمونه:
نام پروژه: ${PROJECT.name}
کارفرما: ${PROJECT.client}
محل: ${PROJECT.location}
زیربنا: ${PROJECT.area} مترمربع، ${PROJECT.units} واحد مسکونی

قلم متره‌ای که باید برایش دستور کار صادر شود:
شرح: ${item.name}
مقدار کل: ${item.qty} ${item.unit}
رشته: ${item.group}

کتابخانه چک‌لیست‌های اجرایی مرتبط (منبع الزامی بندهای اجرایی چک‌لیست خروجی — این ساختار اجرایی مشترک است و مستقل از کشور اعمال می‌شود؛ فقط ارجاعات استاندارد را طبق بانک اطلاعاتی کشور فعالیت تطبیق بده):
${digest}

فقط یک شیء JSON با دقیقاً این کلیدها برگردان، بدون هیچ متن یا بلوک کد اضافه:
{"title": "عنوان کوتاه دستور کار به فارسی", "scope": "شرح محدوده کار در ۲ تا ۳ جمله حرفه‌ای و اجرایی", "materials": ["مصالح یا تجهیز مورد نیاز به صورت رشته کوتاه"], "duration": "مدت زمان پیشنهادی اجرا مثلا 5 روز کاری", "safety": "مهم‌ترین نکته ایمنی و کنترل کیفیت در یک جمله", "checklist": ["۵ تا ۸ بند چک‌لیست اجرایی، انتخاب‌شده و تلخیص‌شده دقیقاً از کتابخانه بالا و متناسب با همین قلم کار، هر بند یک رشته کوتاه فارسی"], "standardsRef": ["۳ تا ۵ کد مرجع استاندارد از بانک اطلاعاتی کشور فعالیت (${activeMeta.label}) که چک‌لیست بر پایه آن تطبیق داده شده"], "rationale": "یک جمله کوتاه فارسی که توضیح دهد چرا دقیقاً همین بندهای چک‌لیست و همین مراجع استاندارد را، متناسب با نوع این قلم کار (${item.group})، انتخاب کردی"}`;
  try{
    const data = await sampleAPI.json(prompt, { modelTier:'default', cache:false });
    Object.assign(holder, {
      title:data.title||item.name, scope:data.scope||'',
      materials:Array.isArray(data.materials)?data.materials:[],
      duration:data.duration||'', safety:data.safety||'',
      checklist:Array.isArray(data.checklist)?data.checklist:[],
      standardsRef:Array.isArray(data.standardsRef)&&data.standardsRef.length ? data.standardsRef : standardsList.slice(0,4),
      rationale:data.rationale||'',
      streaming:false

    holder.streaming = false;
  }
  state.woGenerating = false;
  render();
}

  grid.innerHTML = list.map((p,idx)=> `<div class="photo-thumb"><img src="${p}"><button data-rm-asbuilt="${id}" data-rm-asbuilt-idx="${idx}">${svgIcon('x')}</button></div>`).join('');
  grid.querySelectorAll('[data-rm-asbuilt]').forEach(b=>{
    b.addEventListener('click', ()=>{
      pendingAsbuiltMap[id].splice(Number(b.dataset.rmAsbuiltIdx),1);
      renderPendingAsbuiltGrid(id);
    });
  });
}
function submitExecution(id){ // مرحله ۲: ثبت اجرا توسط سرپرست کارگاه (الزامی: بارگذاری ازبیلت کار اجرا شده)
  const wo = state.workOrders.find(w=>w.id===id);
  if(!wo) return;
  const asbuilt = pendingAsbuiltMap[id]||[];
  if(!asbuilt.length){ toast('برای ثبت اجرا، بارگذاری حداقل یک فایل ازبیلت (نقشه/تصویر چون‌ساخت) الزامی است'); return; }
  const input = document.getElementById('pct-'+id);
  const pct = Math.max(1, Math.min(100, Number(input.value)||100));
  wo.percent=pct; wo.status='executed'; wo.showExecute=false; wo.executedTime=Date.now();
  wo.asbuilt = [...asbuilt];
  delete pendingAsbuiltMap[id];
  toast('اجرای دستور کار و ازبیلت مربوطه توسط سرپرست کارگاه ثبت شد — در انتظار بررسی و تایید نهایی ناظر');
  render();
}
function finalApprove(id){ // مرحله ۳: تایید نهایی ناظر بر اساس ازبیلت ارائه‌شده -> صدور صورت‌وضعیت + کسر از انبار
  const wo = state.workOrders.find(w=>w.id===id);
  if(!wo) return;
  const item = state.boq.find(i=>i.id===wo.itemId);
  const amount = item ? item.qty*item.unitPrice*wo.percent/100 : 0;
  wo.status='confirmed'; wo.confirmedTime=Date.now();
  const consumedQty = item ? Math.round(item.qty*wo.percent/100*100)/100 : 0;
  if(item && state.inventory[item.id]) state.inventory[item.id].consumed += consumedQty;
  const stmt = { id:'st-'+Date.now(), workOrderId:wo.id, workOrderTitle:wo.title, itemName:wo.itemName, percent:wo.percent, amount, consumedQty, unit:item?item.unit:'', date:todayISO(), time:Date.now(), status:'pending_confirm', observerConfirmedBy:null, observerConfirmedTime:null };
  state.statements.push(stmt);
  toast('تایید نهایی ناظر بر اساس ازبیلت ثبت شد؛ صورت‌وضعیت صادر شد و برای تایید نهایی ناظر ارسال گردید');
  render();
  printSection(buildWorkOrderPrintBody(wo), { title:'دستور کار اجرایی (تایید نهایی)', sub:wo.title, filename:'دستور-کار-'+wo.id+'-نهایی', folder:'دستور کار', relatedLabel:wo.title, silent:true });
  printSection(buildStatementPrintBody(stmt), { title:'صورت‌وضعیت', sub:stmt.workOrderTitle, filename:'صورت-وضعیت-'+stmt.id, folder:'صورت‌وضعیت', relatedLabel:stmt.workOrderTitle, silent:true });
}

    ${!noBoq && needsApproval? `<div class="ai-note warn">${svgIcon('alert')}<span>ابتدا از تب «متره و براورد» احجام و قیمت‌ها باید توسط ناظر تایید شود.</span></div>` : ''}
    <div><button class="btn btn-accent" id="genWoBtn" ${state.aiState!=='ready'||state.woGenerating||blocked?'disabled':''}>${svgIcon('sparkle')}<span>تولید دستور کار جدید</span></button></div>

function bindWorkOrderEvents(){
  const btn = document.getElementById('genWoBtn');
  if(btn) btn.addEventListener('click', generateWorkOrder);
  document.querySelectorAll('[data-eng-approve]').forEach(b=> b.addEventListener('click', ()=> engineerApprove(b.dataset.engApprove)));
  document.querySelectorAll('[data-show-exec]').forEach(b=> b.addEventListener('click', ()=> showExecuteForm(b.dataset.showExec)));
  document.querySelectorAll('[data-submit-exec]').forEach(b=> b.addEventListener('click', ()=> submitExecution(b.dataset.submitExec)));
  document.querySelectorAll('[data-final-approve]').forEach(b=> b.addEventListener('click', ()=> finalApprove(b.dataset.finalApprove)));
  document.querySelectorAll('[data-print-wo]').forEach(b=> b.addEventListener('click', ()=> printWorkOrder(b.dataset.printWo)));
  document.querySelectorAll('[data-pick-asbuilt]').forEach(b=>{
    const id = b.dataset.pickAsbuilt;
    b.addEventListener('click', ()=> document.getElementById('asbuiltInput-'+id).click());
  });
  document.querySelectorAll('[id^="asbuiltInput-"]').forEach(input=>{
    const id = input.id.replace('asbuiltInput-','');
    input.addEventListener('change', ()=>{
      const files = Array.from(input.files || []).slice(0, 6);
      if(!files.length) return;
      if(!pendingAsbuiltMap[id]) pendingAsbuiltMap[id] = [];
      files.forEach(f=>{
        const reader = new FileReader();
        reader.onload = ()=>{ pendingAsbuiltMap[id].push(reader.result); renderPendingAsbuiltGrid(id); };
        reader.readAsDataURL(f);
      });
    });
    renderPendingAsbuiltGrid(id);
  });
}

const STMT_STAGE_META = {

  confirmed:        { badge:'badge-success', label:'تایید ناظر — آماده چاپ و پرداخت' },
};
function confirmStatementByObserver(id){
  const s = state.statements.find(x=>x.id===id);
  if(!s || s.status==='confirmed') return;
  const sel = document.getElementById('stmtObserverSelect-'+id);
  const approverId = sel ? sel.value : '';
  if(!approverId){ toast('ناظر تاییدکننده صورت‌وضعیت را انتخاب کنید'); return; }
  s.status = 'confirmed';
  s.observerConfirmedBy = userName(approverId);
  s.observerConfirmedById = approverId;
  s.observerConfirmedTime = Date.now();
  toast('صورت‌وضعیت توسط ناظر تایید شد؛ اکنون برای شرکت قابل چاپ و پرداخت است');
  render();
}

function inventoryRows(){
  return Object.entries(state.inventory).map(([id,inv])=>{
    const remaining = Math.round((inv.initial - inv.consumed)*100)/100;
    return { id, ...inv, remaining };
  });
}
function renderInventory(){
  const rows = inventoryRows();
  const low = rows.filter(r=> r.remaining < r.initial*0.15);
  const trs = rows.map(r=>`
    <tr class="${r.remaining<0?'':''}">
      <td>${escapeHtml(r.name)}</td>
      <td>${escapeHtml(r.unit)}</td>

/* ============================== PURCHASE ============================== */
// چرخه: draft (پیش‌نویس هوش مصنوعی) -> pm_approved (تایید مدیر پروژه، نزد مسئول بازرگانی) ->
// purchased (خرید انجام شد + فاکتور بارگذاری شد توسط مسئول بازرگانی، نزد انباردار) ->
// warehouse_confirmed (ورود جنس به انبار توسط انباردار تایید شد؛ خودکار به واحد مالی ارسال می‌شود)
const PO_STAGE_META = {
  draft:               { badge:'badge-warning', label:'در انتظار تایید مدیر پروژه' },
  pm_approved:         { badge:'badge-primary', label:'تایید مدیر پروژه — نزد مسئول بازرگانی' },
  purchased:           { badge:'badge-accent',  label:'خریداری شد — در انتظار تایید انباردار' },
  warehouse_confirmed: { badge:'badge-success', label:'تایید انباردار — ارسال شد به واحد مالی' },
};
let pendingInvoiceMap = {};
function pmApprovePurchase(id){
  const po = state.purchaseRequests.find(p=>p.id===id);
  if(!po || po.status!=='draft') return;
  const sel = document.getElementById('poPmSelect-'+id);
  const approverId = sel ? sel.value : '';
  if(!approverId){ toast('مدیر پروژه تاییدکننده را انتخاب کنید'); return; }
  po.status = 'pm_approved'; po.pmApprovedBy = userName(approverId); po.pmApprovedTime = Date.now();
  toast('درخواست خرید توسط مدیر پروژه تایید و برای مسئول بازرگانی ارسال شد');
  render();
}
function renderPendingInvoiceLabel(id){
  const el = document.getElementById('invoiceFileLabel-'+id);
  if(!el) return;
  el.textContent = pendingInvoiceMap[id] ? 'فاکتور انتخاب شد ✓' : 'فاکتور خرید انتخاب نشده (الزامی)';
}
function markPurchased(id){
  const po = state.purchaseRequests.find(p=>p.id===id);
  if(!po || po.status!=='pm_approved') return;
  const sel = document.getElementById('poBazarganSelect-'+id);
  const buyerId = sel ? sel.value : '';
  if(!buyerId){ toast('مسئول بازرگانی انجام‌دهنده خرید را انتخاب کنید'); return; }
  if(!pendingInvoiceMap[id]){ toast('برای ثبت خرید، بارگذاری تصویر یا فایل فاکتور الزامی است'); return; }
  po.status = 'purchased'; po.purchasedBy = userName(buyerId); po.purchasedTime = Date.now();
  po.invoice = pendingInvoiceMap[id];
  delete pendingInvoiceMap[id];
  toast('خرید ثبت و فاکتور بارگذاری شد؛ برای تایید ورود به انبار نزد انباردار ارسال شد');
  render();
}
function confirmWarehouseReceipt(id){
  const po = state.purchaseRequests.find(p=>p.id===id);
  if(!po || po.status!=='purchased') return;
  const sel = document.getElementById('poAmbarSelect-'+id);
  const keeperId = sel ? sel.value : '';
  if(!keeperId){ toast('انباردار تاییدکننده ورود جنس را انتخاب کنید'); return; }
  po.status = 'warehouse_confirmed'; po.warehouseConfirmedBy = userName(keeperId); po.warehouseConfirmedTime = Date.now();
  po.financeForwarded = true; po.financeForwardedTime = Date.now();
  toast('ورود جنس به انبار توسط انباردار تایید شد؛ فهرست و فاکتور به‌طور خودکار برای واحد مالی ارسال شد');
  render();
}
async function generatePurchaseRequest(){
  if(!sampleAPI || state.poGenerating) return;
  state.poGenerating = true;
  const holder = { id:'po-'+Date.now(), time:Date.now(), streaming:true, rows:null, status:'draft', pmApprovedBy:null, purchasedBy:null, invoice:null, warehouseConfirmedBy:null, financeForwarded:false };
  state.purchaseRequests.unshift(holder);
  render();
  const list = state.boq.map(i=> `- ${i.name}: ${i.qty} ${i.unit}، قیمت واحد تقریبی ${i.unitPrice.toLocaleString('en-US')} تومان`).join('\n');
  const prompt = `تو دستیار خرید سامانه «دفتر فنی یار» هستی. بر اساس فهرست متره زیر از یک پروژه ساختمانی تاسیساتی نمونه، یک پیش‌نویس درخواست خرید مصالح و تجهیزات تهیه کن.

فهرست متره پروژه:
${list}

فقط یک آرایه JSON برگردان، بدون هیچ متن یا بلوک کد اضافه، حداکثر ۸ عضو، که هر عضو دقیقاً این کلیدها را داشته باشد:
[{"item":"نام کالا یا تجهیز","qty":عدد پیشنهادی سفارش,"unit":"واحد","priority":"بالا یا متوسط یا پایین","note":"توضیح کوتاه یک جمله‌ای"}]`;
  try{
    const data = await sampleAPI.json(prompt, { modelTier:'default', cache:false });
    holder.rows = Array.isArray(data) ? data : [];
    holder.streaming = false;
  }catch(e){
    holder.error = e && e.code==='not_granted' ? 'اجازه اتصال به هوش مصنوعی داده نشد.' : 'تولید درخواست خرید ناموفق بود.';
    holder.streaming = false;
  }
  state.poGenerating = false;
  render();
  if(!holder.error) printSection(buildPurchaseRequestPrintBody(holder), { title:'درخواست خرید', sub:PROJECT.name, filename:'درخواست-خرید-'+holder.id, folder:'درخواست خرید', relatedLabel:PROJECT.name, silent:true });
}

    <div><button class="btn btn-accent" id="askKbBtn" ${state.aiState!=='ready'||state.kbAsking?'disabled':''}>${svgIcon('sparkle')}<span>پرسش از هوش مصنوعی</span></button></div>
    <div id="kbAnswerWrap">${renderKbAnswer()}</div>
  </div>`;
}

function renderKbAnswer(){
  if(state.kbAsking) return `<div class="ai-loading"><div class="spinner"></div><span>در حال جست‌وجو در بانک اطلاعاتی...</span></div>`;
  if(!state.kbAnswer) return '';
  if(state.kbAnswer.error) return `<p class="muted">${escapeHtml(state.kbAnswer.error)}</p>`;
  return `<div class="ai-output">${nl2br(state.kbAnswer.text)}${state.kbAnswer.streaming?'<span class="cursor-blink"></span>':''}</div>`;
}

async function askKnowledgeBase(){
  if(!sampleAPI || state.kbAsking) return;
  const ta = document.getElementById('kbQuestion');
  const question = ta.value.trim();
  if(!question){ toast('سوال خود را وارد کنید'); return; }
  state.kbAsking = true;
  state.kbAnswer = { text:'', streaming:true };
  render();
  const activeMeta = COUNTRIES.find(c=>c.id===state.activeCountry);
  const isIran = state.activeCountry === 'iran';
  const countryKnowledge = KNOWLEDGE_BY_COUNTRY[state.activeCountry] || KNOWLEDGE;
  const refs = countryKnowledge.map(k=> `${k.code} — ${k.title} (${k.org})`).join('\n');
  const ckRefs = CHECKLIST_LIBRARY.map(c=> `${c.title} (منبع: ${c.source}) — شامل بندهایی مانند: ${c.items.slice(0,3).join('؛ ')}`).join('\n');
  const countryNote = isIran ? '' : `\nکاربر «کشور فعالیت» را روی ${activeMeta.label} تنظیم کرده است. پاسخ را صرفاً بر اساس بانک اطلاعاتی ${activeMeta.label} (بالا) بده، نه مقررات ملی ساختمان ایران، مگر آنکه صراحتاً از تطبیق با ایران سوال شود. روش قرارداد/متره رایج این کشور: ${activeMeta.contractLabel}.\n`;
  const prompt = `تو دستیار فنی سامانه «دفتر فنی یار» هستی و بر اساس بانک اطلاعاتی استانداردها و مقررات مهندسی کشور انتخاب‌شده کاربر (${activeMeta.label}) و چک‌لیست‌های اجرایی واقعی بارگذاری‌شده در سامانه، به سوالات فنی پاسخ می‌دهی.
${countryNote}
بانک اطلاعاتی مراجع و استانداردهای ${activeMeta.label}:
${refs}

چک‌لیست‌های اجرایی کتابخانه (مبنای مشترک کنترل کیفیت اجرا؛ در صورت نیاز ارجاعات استاندارد را مطابق بانک اطلاعاتی بالا تطبیق بده):
${ckRefs}

سوال کاربر:
${question}

پاسخ را کوتاه، دقیق و حرفه‌ای به فارسی بده و در صورت امکان اشاره کن این موضوع معمولا ذیل کدام استاندارد یا کد کشور ${activeMeta.label} بررسی می‌شود. در پایان یک جمله یادآوری کن که این پاسخ جنبه نمایشی و آموزشی دارد و باید با متن رسمی و آخرین ویرایش ضوابط همان کشور مطابقت داده شود.`;
  try{
    await sampleAPI(prompt, {
      modelTier:'default', cache:false,
      onText: ({text}) => { state.kbAnswer = { text, streaming:true }; document.getElementById('kbAnswerWrap').innerHTML = renderKbAnswer(); }
    });
    state.kbAnswer.streaming = false;
  }catch(e){
    state.kbAnswer = { error: e && e.code==='not_granted' ? 'اجازه اتصال به هوش مصنوعی داده نشد.' : 'پاسخ‌گویی ناموفق بود. دوباره تلاش کنید.' };
  }
  state.kbAsking = false;
  render();
}

function bindKnowledgeEvents(){
  const search = document.getElementById('kbSearch');
  if(search) search.addEventListener('input', ()=>{ state.kbQuery = search.value; render(); setTimeout(()=>{ const s=document.getElementById('kbSearch'); if(s){ s.focus(); s.selectionStart=s.selectionEnd=s.value.length; } }, 0); });
  const askBtn = document.getElementById('askKbBtn');
  if(askBtn) askBtn.addEventListener('click', askKnowledgeBase);
}

/* ============================== GLOBAL AI ASSISTANT ============================== */
state.assistant = { open:false, messages:[], asking:false };

const APP_GUIDE = `سامانه «دفتر فنی یار» یک دفتر فنی دیجیتال برای مهندسان مشاور، ناظر و پیمانکاران ساختمانی ایران است. نسخه فعلی یک دموی اولیه (پایلوت) برای نمایش به سرمایه‌گذار و نهادهای حمایتی است؛ داده‌های نمونه برای یک پروژه کوچک ساخته شده‌اند، اما اتصال هوش مصنوعی واقعی و زنده است.

بخش‌های سامانه در این دمو:
- داشبورد: خلاصه وضعیت پروژه، براورد کل، تعداد دستور کار و صورت‌وضعیت‌ها.
- بارگذاری نقشه یا متره: بارگذاری فایل مدل Revit/IFC یا فایل خروجی متره‌برآورد (اکسل/PDF/Word) برای پروژه‌هایی که نقشه رویت ندارند؛ سامانه اقلام متره را از آن استخراج می‌کند.
- متره و براورد: جدول قابل‌ویرایش اقلام با قیمت واحد؛ با تغییر قیمت هر ردیف، براورد کل پروژه به‌صورت زنده به‌روزرسانی می‌شود.
- دستور کار: تولید دستور کار اجرایی با هوش مصنوعی بر پایه اقلام متره، همراه با یک چک‌لیست اجرایی مرتبط از کتابخانه فنی. چرخه تایید هر دستور کار ۴ مرحله دارد: ۱) تولید توسط هوش مصنوعی، ۲) تایید ناظر و ارسال به سرپرست کارگاه، ۳) ثبت اجرا توسط سرپرست کارگاه با درصد پیشرفت، ۴) تایید نهایی ناظر که صورت‌وضعیت را صادر و از موجودی انبار کسر می‌کند.
- صورت‌وضعیت: فهرست صورت‌وضعیت‌های صادرشده (پس از تایید نهایی ناظر) و جمع کل آن‌ها؛ قابل چاپ تکی یا گزارش کلی.
- درخواست خرید: پیش‌نویس درخواست خرید مصالح با هوش مصنوعی، قابل دانلود متنی یا چاپ PDF.
- گزارش روزانه: ثبت گزارش متنی و بارگذاری عکس برای مستندسازی کارگاه، با امکان چاپ PDF هر گزارش.
- انبار و موجودی: موجودی اولیه هر قلم (بر پایه متره) و مقدار مصرف‌شده از صورت‌وضعیت‌ها؛ کسر خودکار و هشدار کمبود موجودی.
- بایگانی اسناد: هر سندی که چاپ یا تایید نهایی شود، نسخه PDF آن به‌صورت خودکار در پوشه مربوطه (دستور کار، صورت‌وضعیت، گزارش روزانه، درخواست خرید، متره و براورد، انبار) بایگانی و قابل دانلود مجدد می‌شود.
- بانک استانداردها (دانش فنی): مرجع مباحث مقررات ملی ساختمان، نشریات، آیین‌نامه‌ها، استانداردهای بین‌المللی و چک‌لیست‌های اجرایی مرجع؛ قابل جست‌وجو و پرسش‌وپاسخ. یک انتخاب‌گر «کشور فعالیت» در بالای این بخش و بخش متره و براورد وجود دارد (ایران، عراق، امارات، استرالیا، فنلاند، انگلستان، آمریکا)؛ با انتخاب هر کشور، بانک استانداردها و پاسخ‌های هوش مصنوعی مطابق استانداردهای روز و روش قرارداد/متره همان کشور تنظیم می‌شود — هدف آماده بودن سامانه برای ارائه خدمات در چند کشور است.
- متره و براورد بین‌المللی: با انتخاب کشوری غیر از ایران در همین انتخاب‌گر، به‌جای جدول فهرست‌بهای ایران، نمونه ساختار متره و قرارداد همان کشور نمایش داده می‌شود — برای عراق: قرارداد متراژی (متر مربع) با ساختار شکست هزینه درصدی به‌جای فهرست‌بها؛ برای امارات: فهرست مقادیر (BOQ) و گواهی پرداخت موقت مطابق FIDIC؛ برای استرالیا: برآورد عنصری AIQS و صورت‌وضعیت پیشرفت کار (Progress Claim)؛ برای فنلاند: طبقه‌بندی Talo 2000 و جدول اقساط پرداخت؛ برای انگلستان: قواعد RICS NRM1/NRM2 و گواهی دوره‌ای JCT؛ برای آمریکا: تفکیک CSI MasterFormat/UniFormat و فرم صورت‌وضعیت AIA G702/G703.
- سایر ماژول‌های تخصصی: فهرست ماژول‌هایی که در فاز ۱ توسعه فعال خواهند شد (کنترل پروژه پیشرفته، انبار چند-انباره پیشرفته، BIM 5D، HSE و...).

نکته مهم درباره چاپ/PDF: هر بخش (دستور کار، صورت‌وضعیت، گزارش روزانه، درخواست خرید، متره، انبار، داشبورد) یک دکمه «چاپ / PDF» دارد که یک فایل PDF واقعی می‌سازد، آن را برای دانلود پیشنهاد می‌دهد و همزمان نسخه‌ای از آن را در «بایگانی اسناد» ذخیره می‌کند.`;

const ASSISTANT_SUGGESTIONS = ['سامانه چطور کار می‌کند؟', 'چطور یک دستور کار بسازم؟', 'اگر نقشه رویت ندارم چه کار کنم؟', 'چک‌لیست‌های اجرایی از کجا آمده‌اند؟', 'چطور کشور فعالیت را عوض کنم؟'];

function svgIconRaw(name){ return svgIcon(name); }

function toggleAssistant(force){
  state.assistant.open = (force!==undefined) ? force : !state.assistant.open;
  if(state.assistant.open && !state.assistant.messages.length){
    state.assistant.messages.push({ role:'bot', text:'سلام! من دستیار هوش مصنوعی «دفتر فنی یار» هستم. می‌تونم نحوه کار با سامانه رو توضیح بدم یا به سوال فنی مهندسی‌تون بر اساس کتابخانه فنی سامانه پاسخ بدم.' });
  }
  renderAssistantPanel();
}

function renderAssistantPanel(){
  const panel = document.getElementById('assistantPanel');
  const overlay = document.getElementById('assistantOverlay');
  panel.classList.toggle('open', state.assistant.open);
  overlay.classList.toggle('show', state.assistant.open && window.innerWidth < 640);
  if(!state.assistant.open){ panel.innerHTML=''; return; }
  panel.innerHTML = `
    <div class="assistant-head">
      <h4>${svgIcon('sparkle')}<span>دستیار هوش مصنوعی سامانه</span></h4>
      <button class="assistant-close" id="assistantCloseBtn">${svgIcon('x')}</button>
    </div>
    <div class="assistant-body" id="assistantBody">
      ${state.aiState!=='ready' ? `<div class="assistant-note">${state.aiState==='checking'?'در حال برقراری اتصال زنده هوش مصنوعی...':'اتصال زنده هوش مصنوعی برقرار نشد. <button class="btn btn-outline btn-sm" data-retry-ai style="margin-top:6px">'+svgIcon('refresh')+'<span>تلاش مجدد اتصال</span></button>'}</div>` : ''}
      <div class="assistant-note">${svgIcon('alert')} این دستیار بر پایه کتابخانه فنی داخلی سامانه و دانش عمومی مهندسی پاسخ می‌دهد و در این پیش‌نمایش به اینترنت زنده متصل نیست؛ جست‌وجوی آنلاین لحظه‌ای در نسخه تولیدی قابل افزودن است.</div>
      ${state.assistant.messages.map(m=> `<div class="assistant-msg ${m.role}">${nl2br(m.text)}${m.streaming?'<span class="cursor-blink"></span>':''}</div>`).join('')}
      ${state.assistant.messages.length<=1 ? `<div class="assistant-suggest">${ASSISTANT_SUGGESTIONS.map(s=>`<button class="pill-tab" data-suggest="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join('')}</div>` : ''}
    </div>
    <div class="assistant-foot">
      <textarea id="assistantInput" rows="1" placeholder="سوال خود را بپرسید..." ${state.aiState!=='ready'?'disabled':''}></textarea>
      <button class="assistant-send" id="assistantSendBtn" ${state.aiState!=='ready'||state.assistant.asking?'disabled':''}>${svgIcon('sparkle')}</button>
    </div>`;
  document.getElementById('assistantCloseBtn').addEventListener('click', ()=> toggleAssistant(false));
  const body = document.getElementById('assistantBody');
  body.scrollTop = body.scrollHeight;
  const input = document.getElementById('assistantInput');
  document.getElementById('assistantSendBtn').addEventListener('click', ()=> askAssistant(input.value));
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); askAssistant(input.value); } });
  panel.querySelectorAll('[data-suggest]').forEach(b=> b.addEventListener('click', ()=> askAssistant(b.dataset.suggest)));
}

async function askAssistant(question){
  question = (question||'').trim();
  if(!question || !sampleAPI || state.assistant.asking) return;
  state.assistant.asking = true;
  const history = state.assistant.messages.map(m=> (m.role==='user'?'کاربر: ':'دستیار: ')+m.text).join('\n');
  state.assistant.messages.push({ role:'user', text:question });
  const botMsg = { role:'bot', text:'', streaming:true };
  state.assistant.messages.push(botMsg);
  renderAssistantPanel();
  const activeMeta = COUNTRIES.find(c=>c.id===state.activeCountry);
  const countryKnowledge = KNOWLEDGE_BY_COUNTRY[state.activeCountry] || KNOWLEDGE;
  const kbDigest = countryKnowledge.slice(0,22).map(k=>`${k.code} - ${k.title}`).join('، ');
  const ckDigest = CHECKLIST_LIBRARY.map(c=>`${c.title} (${c.items.length} بند)`).join('، ');
  const prompt = `تو دستیار هوشمند سامانه «دفتر فنی یار» هستی؛ هم راهنمای استفاده از خود سامانه و هم دستیار فنی مهندسی ساختمان هستی.

${APP_GUIDE}

کشور فعالیت انتخاب‌شده کاربر در حال حاضر: ${activeMeta.label} (روش قرارداد/متره رایج: ${activeMeta.contractLabel}). اگر سوال، فنی و مرتبط با استاندارد بود، پاسخ را بر پایه بانک اطلاعاتی همین کشور بده، نه لزوماً مقررات ملی ساختمان ایران.
خلاصه کتابخانه فنی سامانه برای ${activeMeta.label} (مرجع پاسخ‌های فنی): ${kbDigest}
چک‌لیست‌های اجرایی موجود (ساختار اجرایی مشترک، مستقل از کشور): ${ckDigest}

نکته صداقت (در صورت نیاز به کاربر بگو): این پیش‌نمایش در محیطی ایزوله اجرا می‌شود و به اینترنت زنده دسترسی ندارد؛ پاسخ‌های فنی بر پایه کتابخانه داخلی سامانه و دانش عمومی مهندسی مدل زبانی است، نه جست‌وجوی آنلاین لحظه‌ای. این قابلیت در نسخه تولیدی/نهایی قابل افزودن است.

تاریخچه گفت‌وگو تا این لحظه:
${history || '(هنوز گفتگویی نبوده)'}

سوال جدید کاربر: ${question}

پاسخ را کوتاه (حداکثر ۶ تا ۸ جمله)، دقیق، دوستانه و به فارسی بده. اگر سوال درباره نحوه کار با سامانه بود، مرحله‌به‌مرحله و بر اساس بخش‌های واقعی سامانه راهنمایی کن؛ اگر سوال فنی مهندسی بود، بر پایه کتابخانه فنی بالا پاسخ بده و در صورت امکان به مبحث یا استاندارد مرتبط اشاره کن.`;
  try{
    await sampleAPI(prompt, {
      modelTier:'default', cache:false,
      onText: ({text}) => { botMsg.text = text; botMsg.streaming = true; renderAssistantPanel(); }
    });
    botMsg.streaming = false;
  }catch(e){
    botMsg.text = e && e.code==='not_granted' ? 'اجازه اتصال به هوش مصنوعی داده نشد.' : 'پاسخ‌گویی ناموفق بود. لطفا دوباره تلاش کنید.';
    botMsg.streaming = false;
  }
  state.assistant.asking = false;
  renderAssistantPanel();
}

function initAssistant(){
  document.getElementById('assistantFab').innerHTML = svgIcon('sparkle');
  document.getElementById('assistantFab').addEventListener('click', ()=> toggleAssistant());
  document.getElementById('assistantOverlay').addEventListener('click', ()=> toggleAssistant(false));
}

function bindViewEvents(){
  if(state.view==='dashboard') bindDashboardEvents();
  if(state.view==='roi') bindROIEvents();
  if(state.view==='upload') bindUploadEvents();
  if(state.view==='takeoff') bindTakeoffEvents();
  if(state.view==='workorders') bindWorkOrderEvents();
  if(state.view==='statements') bindStatementsEvents();
  if(state.view==='purchase') bindPurchaseEvents();
  if(state.view==='daily') bindDailyEvents();
  if(state.view==='knowledge') bindKnowledgeEvents();
  if(state.view==='inventory') bindInventoryEvents();
  if(state.view==='archive') bindArchiveEvents();
  if(state.view==='projects') bindProjectsEvents();
  if(state.view==='users') bindUsersEvents();
  document.querySelectorAll('[data-nav-link]').forEach(a=> a.addEventListener('click', (e)=>{ e.preventDefault(); state.view=a.dataset.navLink; render(); }));
}

document.getElementById('menuBtn').addEventListener('click', openSidebar);
document.getElementById('overlay').addEventListener('click', closeSidebar);
document.addEventListener('click', (e)=>{ if(e.target.closest('[data-retry-ai]')){ toast('در حال تلاش مجدد برای اتصال به هوش مصنوعی...'); connectAI(); } });
document.addEventListener('click', (e)=>{
  const sw = e.target.closest('[data-switch-project]');
  if(sw){ switchProject(sw.dataset.switchProject); return; }
  const rm = e.target.closest('[data-remove-project]');
  if(rm){
    if(_projects.length<=1) return;
    const id = rm.dataset.removeProject;
    const wasActive = id===_activeProjectId;
    _projects = _projects.filter(p=>p.id!==id);
    if(wasActive) _activeProjectId = _projects[0].id;
    toast('پروژه حذف شد');
    render();
  }
});
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-country]');
  if(!btn) return;
  const id = btn.dataset.country;
  if(id === state.activeCountry) return;
  state.activeCountry = id;
  state.kbAnswer = null;
  toast('کشور فعالیت به «'+countryLabel(id)+'» تغییر یافت — بانک اطلاعاتی و راهنمایی‌های هوش مصنوعی مطابق استانداردهای همان کشور اقدام می‌کنند');
  render();
});

initAssistant();
render();
</script>
